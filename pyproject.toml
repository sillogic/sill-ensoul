[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sill-ensoul"
version = "0.4.0"
description = "OKF-backed long-term memory for agents, exposed via MCP. CLI- and model-agnostic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sillogic" }]
dependencies = [
    # 上界 <2：mcp 2.x 把 FastMCP 改名 MCPServer、删掉 mcp.server.fastmcp 模块（server.py / http.py
    # 都按 1.x API 写）。不钉上界的话，今天新装会拉到 mcp 2.x，sill-ensoul-mcp / sill-ensoul-http
    # 一启动就 ModuleNotFoundError（SIL-7 部署现场实测踩到）。迁移到 mcp 2.x 是后续任务（见
    # docs/ROADMAP.md D11 已知限制），迁移完再放开上界。
    "mcp>=1.2,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 只有远程 HTTP 部署（SIL-7）才需要 uvicorn；stdio 安装保持零额外依赖。
http = ["uvicorn>=0.30"]

[project.scripts]
# 装完后,任意 cwd 直接跑 `sill-ensoul-mcp` 即启动 stdio MCP server。
# 这就是解绑 cwd 的关键:不再依赖 `python -m ensoul.server` + cwd=repo。
sill-ensoul-mcp = "ensoul.server:main"
# 远程 HTTP 部署（SIL-7）：Streamable HTTP + Bearer token 鉴权。需要 [http] extra。
sill-ensoul-http = "ensoul.http:main"
# 初始化全局 KB + 打印各 CLI 适配步骤。分享给同事时,他装完跑这个就行。
sill-ensoul-init = "ensoul.init_cmd:main"

[tool.setuptools]
packages = ["ensoul"]
include-package-data = true

[tool.setuptools.package-data]
ensoul = ["SHELL.md"]
